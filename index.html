<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GH Notify</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app">
      <div class="titlebar" data-tauri-drag-region>
        <div class="titlebar-left">
          <div class="logo"></div>
          <span class="app-name">GH Notify</span>
        </div>
        <div class="titlebar-right">
          <span class="live-dot" id="liveDot" title="Idle"></span>
        </div>
      </div>

      <div class="input-row">
        <form id="addForm" class="add-form" autocomplete="off">
          <input
            id="repoInput"
            type="text"
            placeholder="owner/repo or github.com/owner/repo"
            spellcheck="false"
          />
          <button id="addBtn" class="add-btn" type="submit" aria-label="Watch repository">
            <span class="plus"></span>
          </button>
        </form>
      </div>

      <main class="feed" id="feed">
        <div class="empty-state" id="emptyState">
          <div class="empty-glyph"></div>
          <p>Watch a repository</p>
          <span>Enter a repo above to get notified the moment anyone commits.</span>
        </div>
      </main>
    </div>

    <div class="toast-stack" id="toasts"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
